<div class="photo-controls-container mb-3">
  <!-- Directional Nudge Arrows -->
  <div class="editor-arrows-wrap d-flex justify-content-center align-items-center gap-3">
    <!-- Up Arrow -->
    <button type="button" class="arrow-btn" (click)="move(0, -18)" title="Move photo up">
      <svg viewBox="0 0 24 24" class="arrow-svg" fill="none" stroke="#321447" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="19" x2="12" y2="5"/>
        <polyline points="5 12 12 5 19 12"/>
      </svg>
    </button>

    <!-- Down Arrow -->
    <button type="button" class="arrow-btn" (click)="move(0, 18)" title="Move photo down">
      <svg viewBox="0 0 24 24" class="arrow-svg" fill="none" stroke="#321447" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <polyline points="19 12 12 19 5 12"/>
      </svg>
    </button>

    <!-- Left Arrow -->
    <button type="button" class="arrow-btn" (click)="move(-18, 0)" title="Move photo left">
      <svg viewBox="0 0 24 24" class="arrow-svg" fill="none" stroke="#321447" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/>
        <polyline points="12 19 5 12 12 5"/>
      </svg>
    </button>

    <!-- Right Arrow -->
    <button type="button" class="arrow-btn" (click)="move(18, 0)" title="Move photo right">
      <svg viewBox="0 0 24 24" class="arrow-svg" fill="none" stroke="#321447" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>

  <!-- Zoom Slider (Visible when photo is uploaded) -->
  @if (selectedImageUrl) {
    <div class="zoom-slider-wrap d-flex align-items-center gap-2 mt-3 px-1">
      <button type="button" class="btn-zoom-step" (click)="zoomOut()" title="Zoom out" [disabled]="cropConfig.zoom <= 0.6">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4d1f77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>

      <div class="slider-track-box flex-grow-1">
        <input
          type="range"
          class="zoom-range"
          min="0.6"
          max="3.0"
          step="0.05"
          [value]="cropConfig.zoom"
          (input)="onSliderInput($event)"
          aria-label="Zoom level">
      </div>

      <button type="button" class="btn-zoom-step" (click)="zoomIn()" title="Zoom in" [disabled]="cropConfig.zoom >= 3.0">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#4d1f77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
    </div>
  }
</div>
