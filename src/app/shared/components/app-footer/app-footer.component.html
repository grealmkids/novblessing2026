<footer class="app-footer py-3 text-center position-relative">
  <div class="mobile-shell p-0">
    <div class="footer-text">
      Christ's Heart Ministries · Powered Witness
    </div>

    <!-- Hidden Discreet Visitor Counter Trigger -->
    <div class="mt-2">
      <button
        type="button"
        class="btn-hidden-stats"
        (click)="openVisitorModal()"
        title="Visitor Analytics"
        aria-label="View visitor stats">
        <svg viewBox="0 0 24 24" class="stats-icon" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6" y1="20" x2="6" y2="14"/>
        </svg>
      </button>
    </div>
  </div>
</footer>

<!-- Centered Visitor Counter Modal Popup -->
@if (isModalOpen) {
  <div class="visitor-modal-backdrop" (click)="closeVisitorModal()">
    <div class="visitor-modal-dialog" (click)="$event.stopPropagation()">
      <!-- Close Button -->
      <button type="button" class="btn-close-modal" (click)="closeVisitorModal()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <!-- Modal Header -->
      <div class="modal-header-content text-center mb-3">
        <div class="stats-badge d-inline-flex align-items-center gap-2 mb-2">
          <span class="live-dot"></span>
          <span>LIVE TRAFFIC</span>
        </div>
        <h3 class="modal-title m-0">Website Visitors</h3>
      </div>

      <!-- Stats Numbers Grid -->
      <div class="row g-2 mb-3">
        <!-- Total Visitors -->
        <div class="col-6">
          <div class="stat-card p-3 rounded-3 text-center">
            <div class="stat-value">
              @if (isLoading) {
                <span class="spinner-border spinner-border-sm text-purple" role="status"></span>
              } @else {
                {{ totalVisits | number }}
              }
            </div>
            <div class="stat-label">Total Visitors</div>
          </div>
        </div>

        <!-- Today's Visitors -->
        <div class="col-6">
          <div class="stat-card p-3 rounded-3 text-center stat-today">
            <div class="stat-value text-gold">
              @if (isLoading) {
                <span class="spinner-border spinner-border-sm text-gold" role="status"></span>
              } @else {
                {{ todayVisits | number }}
              }
            </div>
            <div class="stat-label">Today</div>
          </div>
        </div>
      </div>

      <!-- Dismiss Button -->
      <div class="text-center mt-3">
        <button type="button" class="btn-dismiss-modal w-100" (click)="closeVisitorModal()">
          Close
        </button>
      </div>
    </div>
  </div>
}
